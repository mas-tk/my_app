name: my_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+17

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.4.0
  cupertino_icons: ^1.0.8
  http: ^0.13.5
  shared_preferences: ^2.0.15
  path_provider: ^2.0.11
  turn_page_transition: ^0.4.0  # Added for page turn animation
  share_plus: ^10.1.1  # Added for sharing functionality

  # Add these new dependencies for animations
  #flutter_gif: ^0.0.4  # For GIF animations # flutter_gifはエラーが出るため削除
  video_player: ^2.8.1  # For video animations
  lottie: ^2.6.0  # For Lottie animations
  cached_network_image: ^3.3.0  # For better image loading and caching

  # amplify 
  amplify_flutter: ^2.6.1
  amplify_auth_cognito: ^2.6.1
  amplify_authenticator: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

